<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekapitulasi Absensi - SDIT Al Fajri</title>
    <style>
        :root {
            --primary-dark: #2d6a4f;
            --primary-light: #b9fbc0;
            --bg-color: #f4fff8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--primary-dark);
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; justify-content: space-between;
            align-items: center; background: linear-gradient(135deg, #b9fbc0, #98f5e1);
            padding: 15px 25px; border-radius: 12px; margin-bottom: 20px; box-sizing: border-box;
        }

        .btn-back {
            background: white; color: var(--primary-dark); font-weight: bold;
            text-decoration: none; padding: 8px 16px; border-radius: 20px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .container { width: 100%; max-width: 1000px; }

        /* Card Filter */
        .filter-card {
            background: white; border: 2px solid #98f5e1; border-radius: 12px;
            padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            display: flex; flex-wrap: wrap; gap: 15px; align-items: center;
        }

        .filter-group { display: flex; flex-direction: column; flex: 1; min-width: 160px; }
        label { font-weight: bold; font-size: 0.85em; margin-bottom: 5px; }
        select, input, button {
            padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em;
        }
        button {
            background-color: var(--primary-dark); color: white; border: none;
            font-weight: bold; cursor: pointer; height: 42px; align-self: flex-end; width: 100%;
        }
        button:hover { background-color: #1b4332; }

        /* Card Summary Total */
        .summary-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px; margin-bottom: 20px;
        }
        .summary-box {
            background: white; border-radius: 10px; padding: 15px; text-align: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05); border-left: 6px solid var(--primary-dark);
        }
        .summary-box.hadir { border-color: #2e7d32; }
        .summary-box.sakit { border-color: #f57c00; }
        .summary-box.izin { border-color: #0288d1; }
        .summary-box.alpa { border-color: #d32f2f; }
        
        .summary-box h3 { margin: 0; font-size: 2em; color: #111; }
        .summary-box p { margin: 5px 0 0 0; font-weight: bold; color: #555; }

        /* Tabel Rekap */
        .table-container {
            background: white; border-radius: 12px; padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04); overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #eee; }
        th { background-color: var(--primary-dark); color: white; }
        tr:hover { background-color: #f9f9f9; }
    </style>
</head>
<body>

    <div class="header">
        <a href="absensi.html" class="btn-back">⬅️ Ke Presensi</a>
        <h2 style="margin:0;">Dashboard Rekapitulasi Kelas</h2>
        <div></div>
    </div>

    <div class="container">
        <!-- Area Filter -->
        <div class="filter-card">
            <div class="filter-group">
                <label>Jenis Rekap:</label>
                <select id="typeSelect" onchange="toggleFilterType()">
                    <option value="harian">Rekap Harian</option>
                    <option value="bulanan">Rekap Bulanan</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Pilih Kelas:</label>
                <select id="kelasSelect">
                    <option value="1A">Kelas 1A</option>
                    <option value="1B">Kelas 1B</option>
                    <option value="2A">Kelas 2A</option>
                </select>
            </div>
            
            <!-- Filter Tanggal (Harian) -->
            <div class="filter-group" id="dateGroup">
                <label>Pilih Tanggal:</label>
                <input type="date" id="dateInput">
            </div>

            <!-- Filter Bulan & Tahun (Bulanan) -->
            <div class="filter-group" id="monthGroup" style="display:none;">
                <label>Bulan:</label>
                <select id="monthSelect">
                    <option value="Januari">Januari</option>
                    <option value="Februari">Februari</option>
                    <option value="Maret">Maret</option>
                    <option value="April">April</option>
                    <option value="Mei">Mei</option>
                    <option value="Juni">Juni</option>
                    <option value="Juli">Juli</option>
                    <option value="Agustus">Agustus</option>
                    <option value="September">September</option>
                    <option value="Oktober">Oktober</option>
                    <option value="November">November</option>
                    <option value="Desember">Desember</option>
                </select>
            </div>
            <div class="filter-group" id="yearGroup" style="display:none;">
                <label>Tahun:</label>
                <select id="yearSelect">
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>

            <div class="filter-group">
                <button onclick="loadRekapData()">🔍 Tampilkan Rekap</button>
            </div>
        </div>

        <!-- Ringkasan Total Statistik Kelas -->
        <div class="summary-grid">
            <div class="summary-box hadir"><h3 id="totalHadir">0</h3><p>Total Hadir</p></div>
            <div class="summary-box sakit"><h3 id="totalSakit">0</h3><p>Total Sakit</p></div>
            <div class="summary-box izin"><h3 id="totalIzin">0</h3><p>Total Izin</p></div>
            <div class="summary-box alpa"><h3 id="totalAlpa">0</h3><p>Total Alpa</p></div>
        </div>

        <!-- Tabel Detail Data -->
        <div class="table-container">
            <table>
                <thead>
                    <tr id="tableHeader">
                        <th>NIS</th>
                        <th>Nama Siswa</th>
                        <th>Status Kehadiran</th>
                        <th>Keterangan</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="4" style="text-align:center;">Silakan pilih filter lalu klik Tampilkan Rekap.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx4ezfmdFJdbQfb_Q2_3vndWd1CZflSMFlnnQKdl-dxxjTmgqB1fSBuVQd2noRRDq6-/exec';

        // Set default tanggal hari ini
        document.getElementById('dateInput').valueToDate = new Date();
        document.getElementById('dateInput').value = new Date().toISOString().substring(0, 10);

        function toggleFilterType() {
            const type = document.getElementById('typeSelect').value;
            if (type === 'harian') {
                document.getElementById('dateGroup').style.display = 'flex';
                document.getElementById('monthGroup').style.display = 'none';
                document.getElementById('yearGroup').style.display = 'none';
            } else {
                document.getElementById('dateGroup').style.display = 'none';
                document.getElementById('monthGroup').style.display = 'flex';
                document.getElementById('yearGroup').style.display = 'flex';
            }
        }

        function loadRekapData() {
            const type = document.getElementById('typeSelect').value;
            const kelas = document.getElementById('kelasSelect').value;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Memuat data dari server...</td></tr>';

            let url = APPS_SCRIPT_URL + '?kelas=' + encodeURIComponent(kelas);

            if (type === 'harian') {
                const tgl = document.getElementById('dateInput').value;
                url += '&action=getRekapHarian&tanggal=' + tgl;
            } else {
                const bln = document.getElementById('monthSelect').value;
                const thn = document.getElementById('yearSelect').value;
                url += '&action=getRekapBulanan&bulan=' + bln + '&tahun=' + thn;
            }

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    // Update Summary
                    document.getElementById('totalHadir').innerText = data.total.hadir || 0;
                    document.getElementById('totalSakit').innerText = data.total.sakit || 0;
                    document.getElementById('totalIzin').innerText = data.total.izin || 0;
                    document.getElementById('totalAlpa').innerText = data.total.alpa || 0;

                    // Update Table
                    tbody.innerHTML = '';
                    const th = document.getElementById('tableHeader');

                    if (type === 'harian') {
                        th.innerHTML = '<th>NIS</th><th>Nama Siswa</th><th>Status</th><th>Keterangan</th>';
                        data.list.forEach(item => {
                            tbody.innerHTML += `<tr>
                                <td>${item.nis}</td>
                                <td><b>${item.nama}</b></td>
                                <td>${item.status}</td>
                                <td>${item.ket}</td>
                            </tr>`;
                        });
                    } else {
                        th.innerHTML = '<th>NIS</th><th>Nama Siswa</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Alpa</th>';
                        data.list.forEach(item => {
                            tbody.innerHTML += `<tr>
                                <td>${item.nis}</td>
                                <td><b>${item.nama}</b></td>
                                <td><b style="color:green;">${item.hadir}</b></td>
                                <td>${item.sakit}</td>
                                <td>${item.izin}</td>
                                <td>${item.alpa}</td>
                            </tr>`;
                        });
                    }
                })
                .catch(err => {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">Gagal mengambil data. Pastikan Apps Script sudah di-deploy ulang.</td></tr>';
                });
        }
    </script>
</body>
</html>

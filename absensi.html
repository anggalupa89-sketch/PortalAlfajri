<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Siswa - SDIT Al Fajri Cahaya Umat</title>
    <style>
        :root {
            --primary-color: #1b5e20;
            --bg-color: #e8f5e9;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 2px solid var(--primary-color);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
        }

        .status-badge {
            text-align: center;
            font-size: 0.85em;
            background: #c8e6c9;
            color: #1b5e20;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .input-scan {
            background-color: #f1f8e9;
            border: 2px solid var(--primary-color);
            font-weight: bold;
            font-size: 1.1em;
            text-align: center;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0d3b10;
        }

        /* Alert Notifikasi Presensi */
        #alertBox {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        /* Tabel Histori Log Presensi Terakhir */
        .log-container {
            margin-top: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th { background-color: var(--primary-color); color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Presensi SDIT Al Fajri</h2>
        <div class="status-badge" id="siswaCounter">Memuat data siswa dari Google Sheets...</div>

        <!-- Mode Scan Barcode (Otomatis) -->
        <div class="form-group">
            <label for="barcodeInput">📷 Scan Barcode 1D (NIS):</label>
            <input type="text" id="barcodeInput" class="input-scan" placeholder="Arahkan Scanner ke Barcode..." autofocus autocomplete="off">
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <!-- Mode Input Manual (Opsi Pengganti Scanner) -->
        <div class="form-group">
            <label for="siswaSelect">👤 Atau Pilih Siswa (Otomatis Terisi):</label>
            <select id="siswaSelect" onchange="onSiswaSelected()">
                <option value="">-- Memuat Daftar Siswa --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="statusSelect">Status Presensi:</label>
            <select id="statusSelect">
                <option value="Hadir">Hadir</option>
                <option value="Sakit">Sakit</option>
                <option value="Izin">Izin</option>
                <option value="Alpa">Alpa</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ketInput">Keterangan (Opsional):</label>
            <input type="text" id="ketInput" placeholder="Contoh: Surat dokter / Acara keluarga">
        </div>

        <button onclick="kirimPresensiManual()">Simpan Presensi Manual</button>

        <div id="alertBox"></div>

        <!-- Tabel Log Pemindaian Terakhir -->
        <div class="log-container">
            <h4 style="margin-bottom: 10px; color: var(--primary-color);">Riwayat Scan Hari Ini:</h4>
            <table>
                <thead>
                    <tr>
                        <th>Waktu</th>
                        <th>Nama</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="logBody">
                    <tr><td colspan="3" style="text-align:center;">Belum ada presensi yang di-scan.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // MASUKKAN URL WEB APP APPS SCRIPT ANDA DI SINI
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxXuUjc4VOHDuxeQER8qdWVpSbn8vDKDk_HI2PNRRViLt_bkuEfE1wFM1ODl1CrQw_1/exec';

        let dataSiswaMaster = [];

        // Load Otomatis saat Halaman Dibuka
        document.addEventListener('DOMContentLoaded', function() {
            loadSiswaOtomatis();
            
            // Auto focus ke input scan barcode
            const scanInput = document.getElementById('barcodeInput');
            
            // Deteksi Enter dari Alat Scanner 1D
            scanInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const value = scanInput.value.trim();
                    if (value !== "") {
                        prosesPresensiBarcode(value);
                        scanInput.value = "";
                    }
                }
            });
        });

        // 1. Tarik Ratusan Siswa Otomatis dari Google Sheets
        function loadSiswaOtomatis() {
            fetch(APPS_SCRIPT_URL + '?action=getDaftarSiswa')
                .then(res => res.json())
                .then(data => {
                    dataSiswaMaster = data;
                    const select = document.getElementById('siswaSelect');
                    const counter = document.getElementById('siswaCounter');

                    select.innerHTML = '<option value="">-- Pilih Nama Siswa --</option>';
                    
                    data.forEach(siswa => {
                        select.innerHTML += `<option value="${siswa.nis}" data-nama="${siswa.nama}">${siswa.nama} (${siswa.kelas}) - NIS: ${siswa.nis}</option>`;
                    });

                    counter.innerText = `✅ Database Aktif: Terhubung ${data.length} Siswa`;
                })
                .catch(err => {
                    document.getElementById('siswaCounter').innerText = "⚠️ Gagal terhubung ke Google Sheets.";
                    console.error(err);
                });
        }

        // 2. Proses Presensi Otomatis via Scan Barcode
        function prosesPresensiBarcode(nis) {
            // Cari data nama di memori lokal jika ada
            const siswaFound = dataSiswaMaster.find(s => String(s.nis).trim() === String(nis).trim());
            const namaSiswa = siswaFound ? siswaFound.nama : nis;
            const status = document.getElementById('statusSelect').value;

            kirimDataKeServer({
                nis: nis,
                nama: namaSiswa,
                status: status,
                keterangan: "Scan Barcode 1D"
            });
        }

        // 3. Proses Presensi Manual dari Dropdown
        function kirimPresensiManual() {
            const select = document.getElementById('siswaSelect');
            const nis = select.value;
            const selectedOption = select.options[select.selectedIndex];
            const nama = selectedOption.getAttribute('data-nama');
            const status = document.getElementById('statusSelect').value;
            const ket = document.getElementById('ketInput').value || "-";

            if (!nis) {
                showAlert("Pilih nama siswa terlebih dahulu!", "error");
                return;
            }

            kirimDataKeServer({
                nis: nis,
                nama: nama,
                status: status,
                keterangan: ket
            });
        }

        // 4. Pengiriman Data Presensi ke Google Sheets (Apps Script)
        function kirimDataKeServer(payload) {
            showAlert("Mengirim data presensi...", "success");

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                showAlert(`✅ Presensi ${payload.nama} (${payload.status}) Berhasil Disimpan!`, "success");
                tambahLogTabel(payload.nama, payload.status);
                
                // Reset input manual
                document.getElementById('siswaSelect').value = "";
                document.getElementById('ketInput').value = "";
                document.getElementById('barcodeInput').focus();
            })
            .catch(err => {
                showAlert("❌ Gagal menyimpan presensi. Periksa koneksi internet.", "error");
                console.error(err);
            });
        }

        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            box.className = type === 'success' ? 'alert-success' : 'alert-error';
            box.innerText = msg;
            box.style.display = 'block';

            setTimeout(() => {
                box.style.display = 'none';
            }, 4000);
        }

        function tambahLogTabel(nama, status) {
            const tbody = document.getElementById('logBody');
            if (tbody.innerHTML.includes("Belum ada presensi")) {
                tbody.innerHTML = "";
            }

            const now = new Date();
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            const row = `<tr>
                <td>${timeStr}</td>
                <td><b>${nama}</b></td>
                <td><span style="color:${status === 'Hadir' ? 'green' : 'orange'}">${status}</span></td>
            </tr>`;

            tbody.innerHTML = row + tbody.innerHTML;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Barcode - SDIT Al Fajri</title>
    <style>
        :root {
            --primary-light: #b9fbc0;
            --primary-mid: #98f5e1;
            --primary-dark: #2d6a4f;
            --bg-color: #f4fff8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--primary-dark);
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }

        .header {
            width: 100%; max-width: 1100px; display: flex; justify-content: space-between;
            align-items: center; background: linear-gradient(135deg, var(--primary-light), var(--primary-mid));
            padding: 15px 25px; border-radius: 12px; margin-bottom: 20px; box-sizing: border-box;
        }

        .btn-back {
            background: white; color: var(--primary-dark); font-weight: bold;
            text-decoration: none; padding: 8px 16px; border-radius: 20px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .btn-back:hover { background: #e8fccf; }

        .container {
            display: flex; flex-wrap: wrap; gap: 20px; width: 100%; max-width: 1100px;
        }

        .panel {
            background: white; border: 2px solid var(--primary-mid);
            border-radius: 15px; padding: 20px; flex: 1; min-width: 300px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04); box-sizing: border-box;
        }

        .mascot-container {
            display: flex; justify-content: center; align-items: center;
            gap: 20px; height: 75px; margin-bottom: 10px;
        }
        .animal-icon {
            font-size: 3em; animation: bounceAnimal 2s infinite ease-in-out; user-select: none;
        }
        .animal-icon.rabbit { animation-delay: 0.3s; }

        @keyframes bounceAnimal {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-14px); }
        }

        .scan-box {
            background: #e8fccf; border: 2px dashed var(--primary-dark);
            padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px;
        }
        #scanInput {
            width: 100%; padding: 12px; font-size: 1.1em;
            border: 2px solid var(--primary-dark); border-radius: 8px; text-align: center; outline: none;
        }

        .scan-result {
            margin-top: 15px; padding: 12px; border-radius: 10px;
            text-align: center; font-size: 1.2em; font-weight: bold; display: none;
        }
        .success-bg { background-color: #d4edda; color: #155724; }
        .warning-bg { background-color: #fff3cd; color: #856404; }

        input, select, button {
            width: 100%; padding: 10px; margin: 6px 0;
            border: 1px solid var(--primary-mid); border-radius: 8px; font-size: 0.95em;
        }
        button {
            background-color: var(--primary-dark); color: white; border: none;
            font-weight: bold; cursor: pointer; padding: 12px; transition: 0.3s;
        }
        button:hover { background-color: #1b4332; }

        ul { list-style: none; padding: 0; max-height: 250px; overflow-y: auto; }
        li {
            background: #f0f4f1; margin: 6px 0; padding: 8px 12px; border-radius: 8px;
            display: flex; justify-content: space-between; border-left: 4px solid var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="btn-back">⬅️ Menu Utama</a>
        <h2 style="margin:0;">Presensi Barcode Siswa</h2>
        <div id="clock" style="font-weight: bold;">00:00:00</div>
    </div>

    <div class="container">
        <!-- Panel Scanner -->
        <div class="panel">
            <div class="mascot-container">
                <span class="animal-icon cat">🐱</span>
                <span class="animal-icon rabbit">🐰</span>
            </div>

            <div class="scan-box">
                <label for="scanInput"><b>Arahkan Scanner 1D ke Kartu Siswa</b></label><br><br>
                <input type="text" id="scanInput" placeholder="Klik di sini lalu Scan Barcode..." autofocus autocomplete="off">
            </div>
            
            <div id="scanResult" class="scan-result success-bg">
                BERHASIL: <span id="studentName">Nama Siswa</span>
            </div>
            <audio id="beepSound" src="https://www.soundjay.com/buttons/sounds/button-09.mp3" preload="auto"></audio>
        </div>

        <!-- Panel Input Manual -->
        <div class="panel">
            <h3>Input Manual (Izin / Sakit / Lupa)</h3>
            <label style="font-size:0.8em; font-weight:bold;">Cari Nama / Ketik Nama Depan:</label>
            <input type="text" id="manualName" list="studentListOptions" placeholder="Ketik nama..." autocomplete="off">
            <datalist id="studentListOptions"></datalist>

            <select id="manualStatus">
                <option value="Hadir (Lupa Kartu)">Hadir (Lupa Kartu)</option>
                <option value="Sakit">Sakit</option>
                <option value="Izin">Izin</option>
            </select>
            <input type="text" id="manualKet" placeholder="Keterangan (Opsional)">
            <button onclick="submitManual()">Kirim Data Manual</button>
        </div>

        <!-- Panel Riwayat -->
        <div class="panel">
            <h3>Siswa Absen Hari Ini</h3>
            <ul id="historyList"></ul>
        </div>
    </div>

    <script>
        // URL Web App Apps Script Resmi
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwev0NmTAtERop2wBvT8geSrRrC4JRYvfwFIxnK9j9O2L_XZjNOco9jOfq5oATnDL1i/exec'; 

        const databaseSiswa = {
            "262701003": "Albee Abizar Pahlevi",
            "262701004": "Alexander Abraham",
            "262701005": "Muhammad Ramdan",
            "1004": "Fatimah Azzahra"
        }; 

        function populateAutocomplete() {
            const datalist = document.getElementById('studentListOptions');
            datalist.innerHTML = '';
            Object.values(databaseSiswa).forEach(nama => {
                const opt = document.createElement('option');
                opt.value = nama;
                datalist.appendChild(opt);
            });
        }
        populateAutocomplete();

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID');
        }, 1000);

        const scanInput = document.getElementById('scanInput');
        document.addEventListener('click', (e) => {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
                scanInput.focus();
            }
        });

        scanInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                let rawNis = scanInput.value.replace(/[^a-zA-Z0-9]/g, '').trim();
                if (rawNis !== '') {
                    let nama = databaseSiswa[rawNis] || "Siswa (NIS: " + rawNis + ")";
                    let isUnknown = !databaseSiswa[rawNis];
                    
                    addToHistory(nama, 'Hadir');
                    playSuccessSound(nama, isUnknown);
                    scanInput.value = '';
                    sendDataToSheets(nama, 'Hadir', 'Scan Barcode: ' + rawNis);
                }
            }
        });

        function playSuccessSound(nama, isUnknown) {
            const sound = document.getElementById('beepSound');
            sound.currentTime = 0; sound.play().catch(()=>{});

            const res = document.getElementById('scanResult');
            document.getElementById('studentName').innerText = nama;
            res.className = isUnknown ? "scan-result warning-bg" : "scan-result success-bg";
            res.style.display = 'block';

            clearTimeout(window.scanTimeout);
            window.scanTimeout = setTimeout(() => { res.style.display = 'none'; }, 2200);
        }

        function addToHistory(nama, status) {
            const list = document.getElementById('historyList');
            const li = document.createElement('li');
            const time = new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
            li.innerHTML = `<span><b>${nama}</b> <small>(${time})</small></span> <span>${status}</span>`;
            list.prepend(li);
        }

        function sendDataToSheets(nama, status, ket) {
            if (!APPS_SCRIPT_URL) return;
            
            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({
                    nama: nama,
                    status: status,
                    keterangan: ket
                })
            })
            .then(() => console.log("Data berhasil dikirim ke Apps Script!"))
            .catch(err => console.error("Gagal mengirim data:", err));
        }

        function submitManual() {
            const nama = document.getElementById('manualName').value.trim();
            const status = document.getElementById('manualStatus').value;
            const ket = document.getElementById('manualKet').value.trim();
            if(!nama) return alert("Nama wajib diisi!");
            
            addToHistory(nama, status);
            playSuccessSound(nama, false);
            sendDataToSheets(nama, status, ket || "Manual Input");
            
            document.getElementById('manualName').value = '';
            document.getElementById('manualKet').value = '';
            scanInput.focus();
        }
    </script>
</body>
</html>

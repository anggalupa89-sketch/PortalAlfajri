<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Siswa - SDIT Al Fajri Cahaya Umat</title>
    <style>
        :root {
            --primary-green: #1b5e20;
            --accent-gold: #d4af37;
            --light-green: #e8f5e9;
            --dark-green: #0d3b10;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Background Gambar Suasana Sekolah & Overlay Soft Green */
            background: linear-gradient(rgba(232, 245, 233, 0.92), rgba(232, 245, 233, 0.92)), 
                        url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Container dibuat Wide / Landscape (Max 1100px) */
        .container {
            width: 100%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.96);
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 2px solid var(--primary-green);
            backdrop-filter: blur(5px);
        }

        /* Header dengan Logo & Judul */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid var(--accent-gold);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .school-logo {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .header-title h2 {
            margin: 0;
            color: var(--primary-green);
            font-size: 1.5em;
            letter-spacing: 0.5px;
        }

        .header-title p {
            margin: 3px 0 0 0;
            color: #555;
            font-size: 0.85em;
            font-weight: 600;
        }

        .nav-btn {
            background: var(--primary-green);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: var(--dark-green);
        }

        .status-badge {
            text-align: center;
            font-size: 0.85em;
            background: #c8e6c9;
            color: var(--primary-green);
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-weight: bold;
            border: 1px solid var(--primary-green);
        }

        /* Tata Letak Grid 2 Kolom (Landscape Layout) */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        .card-panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #c8e6c9;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--primary-green);
            font-size: 0.9em;
        }

        input, select, button {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95em;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: var(--primary-green);
            outline: none;
            box-shadow: 0 0 0 2px rgba(27, 94, 32, 0.2);
        }

        .input-scan {
            background-color: #f1f8e9;
            border: 2px solid var(--primary-green);
            font-weight: bold;
            font-size: 1.1em;
            text-align: center;
            color: var(--dark-green);
        }

        button {
            background-color: var(--primary-green);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--dark-green);
        }

        /* Alert Notifikasi Presensi */
        #alertBox {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-weight: bold;
            font-size: 0.9em;
        }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        /* Tabel Log Pemindaian Terakhir (Kolom Kanan) */
        .log-container h4 {
            margin: 0 0 12px 0;
            color: var(--primary-green);
            font-size: 1em;
        }
        .table-scroll {
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88em;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }
        th { 
            background-color: var(--primary-green); 
            color: white; 
            position: sticky;
            top: 0;
        }
        tr:hover { background-color: #f9f9f9; }

        /* Responsif jika diakses dari layar kecil */
        @media (max-width: 850px) {
            .grid-layout { grid-template-columns: 1fr; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Sekolah dengan Logo -->
        <div class="header">
            <div class="header-brand">
                <!-- SVG Logo Sekolah (Dapat diganti URL gambar logo asli jika ada) -->
                <svg class="school-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="48" fill="#1b5e20" stroke="#d4af37" stroke-width="4"/>
                    <path d="M50 20 L75 40 L25 40 Z" fill="#d4af37"/>
                    <rect x="30" y="42" width="40" height="35" rx="3" fill="white"/>
                    <path d="M40 50 L60 50 M40 60 L60 60 M40 70 L55 70" stroke="#1b5e20" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <div class="header-title">
                    <h2>SDIT AL FAJRI CAHAYA UMAT</h2>
                    <p>Sistem Presensi & Pemindaian Barcode Siswa</p>
                </div>
            </div>
            <a href="index.html" class="nav-btn">⬅️ Portal Utama</a>
        </div>

        <div class="status-badge" id="siswaCounter">Memuat data siswa dari Google Sheets...</div>

        <!-- Tata Letak Landscape 2 Kolom -->
        <div class="grid-layout">
            
            <!-- KOLOM KIRI: Form Pindaian & Input Manual -->
            <div class="card-panel">
                <!-- Mode Scan Barcode (Otomatis) -->
                <div class="form-group">
                    <label for="barcodeInput">📷 Scan Barcode 1D (NIS Siswa):</label>
                    <input type="text" id="barcodeInput" class="input-scan" placeholder="Arahkan Scanner ke Kartu..." autofocus autocomplete="off">
                </div>

                <hr style="margin: 18px 0; border: 0; border-top: 1px dashed var(--primary-green);">

                <!-- Mode Input Manual (Opsi Pengganti Scanner) -->
                <div class="form-group">
                    <label for="siswaSelect">👤 Atau Pilih Siswa Manual:</label>
                    <select id="siswaSelect">
                        <option value="">-- Memuat Daftar Siswa --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="statusSelect">Status Presensi:</label>
                    <select id="statusSelect">
                        <option value="Hadir">Hadir</option>
                        <option value="Sakit">Sakit</option>
                        <option value="Izin">Izin</option>
                        <option value="Alpa">Alpa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ketInput">Keterangan (Opsional):</label>
                    <input type="text" id="ketInput" placeholder="Contoh: Surat dokter / Acara keluarga">
                </div>

                <button onclick="kirimPresensiManual()">Simpan Presensi Manual</button>
                <div id="alertBox"></div>
            </div>

            <!-- KOLOM KANAN: Riwayat Pemindaian Terakhir -->
            <div class="card-panel log-container">
                <h4>📋 Riwayat Scan Hari Ini:</h4>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>Waktu</th>
                                <th>Nama Siswa</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="logBody">
                            <tr><td colspan="3" style="text-align:center;">Belum ada presensi yang di-scan.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxXuUjc4VOHDuxeQER8qdWVpSbn8vDKDk_HI2PNRRViLt_bkuEfE1wFM1ODl1CrQw_1/exec';

        let dataSiswaMaster = [];

        document.addEventListener('DOMContentLoaded', function() {
            loadSiswaOtomatis();
            
            const scanInput = document.getElementById('barcodeInput');
            scanInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const value = scanInput.value.trim();
                    if (value !== "") {
                        prosesPresensiBarcode(value);
                        scanInput.value = "";
                    }
                }
            });
        });

        function loadSiswaOtomatis() {
            fetch(APPS_SCRIPT_URL + '?action=getDaftarSiswa')
                .then(res => res.json())
                .then(data => {
                    dataSiswaMaster = data;
                    const select = document.getElementById('siswaSelect');
                    const counter = document.getElementById('siswaCounter');

                    select.innerHTML = '<option value="">-- Pilih Nama Siswa --</option>';
                    
                    data.forEach(siswa => {
                        select.innerHTML += `<option value="${siswa.nis}" data-nama="${siswa.nama}">${siswa.nama} (${siswa.kelas}) - NIS: ${siswa.nis}</option>`;
                    });

                    counter.innerText = `✅ Database Aktif: Terhubung ${data.length} Siswa`;
                })
                .catch(err => {
                    document.getElementById('siswaCounter').innerText = "⚠️ Gagal terhubung ke Google Sheets.";
                    console.error(err);
                });
        }

        function prosesPresensiBarcode(nis) {
            const siswaFound = dataSiswaMaster.find(s => String(s.nis).trim() === String(nis).trim());
            const namaSiswa = siswaFound ? siswaFound.nama : nis;
            const status = document.getElementById('statusSelect').value;

            kirimDataKeServer({
                nis: nis,
                nama: namaSiswa,
                status: status,
                keterangan: "Scan Barcode 1D"
            });
        }

        function kirimPresensiManual() {
            const select = document.getElementById('siswaSelect');
            const nis = select.value;
            const selectedOption = select.options[select.selectedIndex];
            const nama = selectedOption.getAttribute('data-nama');
            const status = document.getElementById('statusSelect').value;
            const ket = document.getElementById('ketInput').value || "-";

            if (!nis) {
                showAlert("Pilih nama siswa terlebih dahulu!", "error");
                return;
            }

            kirimDataKeServer({
                nis: nis,
                nama: nama,
                status: status,
                keterangan: ket
            });
        }

        function kirimDataKeServer(payload) {
            showAlert("Mengirim data presensi...", "success");

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                showAlert(`✅ Presensi ${payload.nama} (${payload.status}) Berhasil Disimpan!`, "success");
                tambahLogTabel(payload.nama, payload.status);
                
                document.getElementById('siswaSelect').value = "";
                document.getElementById('ketInput').value = "";
                document.getElementById('barcodeInput').focus();
            })
            .catch(err => {
                showAlert("❌ Gagal menyimpan presensi. Periksa koneksi internet.", "error");
                console.error(err);
            });
        }

        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            box.className = type === 'success' ? 'alert-success' : 'alert-error';
            box.innerText = msg;
            box.style.display = 'block';

            setTimeout(() => {
                box.style.display = 'none';
            }, 4000);
        }

        function tambahLogTabel(nama, status) {
            const tbody = document.getElementById('logBody');
            if (tbody.innerHTML.includes("Belum ada presensi")) {
                tbody.innerHTML = "";
            }

            const now = new Date();
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            const row = `<tr>
                <td>${timeStr}</td>
                <td><b>${nama}</b></td>
                <td><span style="color:${status === 'Hadir' ? 'green' : 'orange'}">${status}</span></td>
            </tr>`;

            tbody.innerHTML = row + tbody.innerHTML;
        }
    </script>
</body>
</html>
